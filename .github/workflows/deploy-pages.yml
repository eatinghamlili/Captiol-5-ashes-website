name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/configure-pages@v6
        with:
          # Turn Pages on through the API, so deploying does not depend on the
          # repository setting having been switched to GitHub Actions by hand.
          enablement: true

      - name: Work out the Pages base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          # A <user>.github.io repo is served from the domain root; any other
          # repo is served from /<repo>/.
          case "$repo" in
            *.github.io) echo "path=/" >> "$GITHUB_OUTPUT" ;;
            *)           echo "path=/$repo/" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        env:
          PORT: '5000'
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: pnpm --filter @workspace/volcanic-ash-anatomy run build

      - name: Add a 404 fallback so deep links resolve
        # Mirrors the `/* -> /index.html` rewrite in artifact.toml, since
        # GitHub Pages has no rewrite rules of its own.
        run: |
          dist=artifacts/volcanic-ash-anatomy/dist/public
          cp "$dist/index.html" "$dist/404.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/volcanic-ash-anatomy/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
