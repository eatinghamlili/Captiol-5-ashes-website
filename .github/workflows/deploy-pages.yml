name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Pushing the built site to the gh-pages branch is all this needs; the
  # Pages-native actions wanted `pages: write`, which could not create the
  # Pages site because that call requires admin scope.
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    # pnpm-workspace.yaml keeps only linux-x64 binaries, so this must be Ubuntu.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Work out the Pages base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          # A <user>.github.io repo is served from the domain root; any other
          # repo is served from /<repo>/.
          case "$repo" in
            *.github.io) echo "path=/" >> "$GITHUB_OUTPUT" ;;
            *)           echo "path=/$repo/" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        env:
          PORT: '5000'
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: pnpm --filter @workspace/volcanic-ash-anatomy run build

      - name: Publish the build to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dist=artifacts/volcanic-ash-anatomy/dist/public

          # Pages has no rewrite rules, so serve index.html for unknown paths.
          cp "$dist/index.html" "$dist/404.html"
          # Stop Pages running the output through Jekyll, which would drop any
          # file or directory whose name begins with an underscore.
          touch "$dist/.nojekyll"

          cd "$dist"
          git init -q
          git checkout -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy $GITHUB_SHA"
          # The branch holds build output only, so each deploy replaces it.
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
